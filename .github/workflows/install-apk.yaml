name: Install Extract APK
run-name: Install Extract - ${{inputs.run_name}}

on:
  workflow_dispatch:
    inputs:
      run_name:
        required: false
        type: string

env:
  avd_port: 9999
  avd_name: localhost:9999
  wa_bundle_url: https://github.com/kasuara/apk-install-extract/releases/download/v1.0.0/wa_bundle_7z.zip
  all_apk_dir: all_apks

jobs:
  install-and-extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y adb aapt p7zip-full unzip wget

      - name: Install reDroid dependencies
        run: |
          sudo apt-get install -y linux-modules-extra-`uname -r` || true
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" || true

      - name: Download bundle
        run: |
          mkdir -p ${{env.all_apk_dir}}
          wget "${{env.wa_bundle_url}}" -O bundle.zip
          unzip bundle.zip -d ${{env.all_apk_dir}}
          find ${{env.all_apk_dir}} -type f -name "*.7z" -exec 7z x {} -o${{env.all_apk_dir}} -y \;
          ls -la ${{env.all_apk_dir}}
          find ${{env.all_apk_dir}} -type f -name "*.apk"

      - name: Run emulator
        run: |
          mkdir data
          docker run -itd --rm --privileged --pull always -v $(pwd)/data:/data -p ${{env.avd_port}}:5555 redroid/redroid:12.0.0-latest
          sleep 30

      - name: adb connect
        run: |
          adb connect ${{env.avd_name}}
          adb devices -l
          sleep 10

      - name: Install WhatsApp (all splits)
        run: |
          adb -s ${{env.avd_name}} install-multiple -r ${{env.all_apk_dir}}/*.apk

      - name: Launch WhatsApp
        run: |
          adb -s ${{env.avd_name}} shell am start -n com.whatsapp/com.whatsapp.Main || true
          sleep 180

      - name: Extract decompressed libs
        run: |
          docker stop $(docker ps -a -q) || true
          sudo chown -R runner:runner data || true
          find data -type d -name "decompressed" 2>/dev/null
          find data -type d -name "libs.spk.zst" 2>/dev/null
          ls -la data/data/com.whatsapp/files/ 2>/dev/null || echo "no files dir"

      - name: Package results
        if: always()
        run: |
          tar cvzf whatsapp_decompressed.tar.gz data/ 2>/dev/null || echo "no data"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp_data
          path: whatsapp_decompressed.tar.gz
          retention-days: 30
          if-no-files-found: warn
